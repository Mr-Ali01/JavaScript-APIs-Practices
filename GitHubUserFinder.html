<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub User Finder</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0d1117; color: white; }
    .card { background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; width: 320px; text-align: center; }
    input { padding: 10px; width: 70%; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: white; }
    button { padding: 10px 15px; border: none; background: #238636; color: white; border-radius: 6px; cursor: pointer; }
    .avatar { width: 100px; height: 100px; border-radius: 50%; margin-top: 15px; display: none; }
    .error { color: #f85149; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h3>GitHub User Finder</h3>
    <input type="text" id="username" placeholder="Enter GitHub username...">
    <button onclick="searchUser()">Search</button>

    <div id="profileContainer">
      <img id="avatar" class="avatar" src="" alt="Profile Picture">
      <h4 id="name"></h4>
      <p id="bio"></p>
      <p id="repos"></p>
    </div>
    <p id="error" class="error"></p>
  </div>

  <script>
    async function searchUser() {
      const usernameInput = document.getElementById('username').value.trim();
      const avatarEl = document.getElementById('avatar');
      const nameEl = document.getElementById('name');
      const bioEl = document.getElementById('bio');
      const reposEl = document.getElementById('repos');
      const errorEl = document.getElementById('error');

      // Reset previous state
      errorEl.innerText = "";
      if (!usernameInput) {
        errorEl.innerText = "Please enter a username!";
        return;
      }

      try {
        const url = `https://api.github.com/users/${usernameInput}`;

        // YOUR TASK:
        // 1. Fetch data from `url`
        const userResponse = await fetch(url);
        
        if(userResponse.ok){
        // 3. Convert response to JSON
            const userData = await userResponse.json();
            // 4. Update UI properties:
        //    - avatarEl.src = data.avatar_url
        //    - avatarEl.style.display = "inline-block"
        //    - nameEl.innerText = data.name || data.login
        //    - bioEl.innerText = data.bio || "No bio available"
        //    - reposEl.innerText = `Public Repos: ${data.public_repos}`
            avatarEl.src = `${userData.avatar_url}`;
            avatarEl.style.display = "inline-block";
            nameEl.innerText = `${userData.name}`
            nameEl.innerText = userData.name || userData.login; 
            bioEl.innerText = userData.bio || "No bio available";
        } else {
            // 2. If response status is 404, throw error "User not found!"
            throw new Error(`User Name Not Found Error! Status ${userResponse.status}`);
        }
        

      } catch (err) {
        avatarEl.style.display = "none";
        nameEl.innerText = "";
        bioEl.innerText = "";
        reposEl.innerText = "";
        errorEl.innerText = err.message;
      }
    }
  </script>
</body>
</html>
