<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debounced Product Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 40px 16px; }
    .container { width: 100%; max-width: 540px; }
    h2 { color: #38bdf8; margin-bottom: 8px; text-align: center; }
    .subtitle { color: #94a3b8; font-size: 14px; text-align: center; margin-bottom: 20px; }
    .search-box { position: relative; }
    input { width: 100%; padding: 14px 16px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 16px; outline: none; }
    input:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
    .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: #94a3b8; min-height: 24px; }
    .counter-badge { background: #334155; color: #38bdf8; padding: 2px 8px; border-radius: 12px; font-weight: bold; }
    .results-list { margin-top: 16px; list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .product-item { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
    .product-title { font-weight: 600; color: #e2e8f0; }
    .product-category { font-size: 12px; color: #64748b; margin-top: 2px; }
    .product-price { color: #4ade80; font-weight: 700; font-size: 16px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🛍️ Product Search</h2>
    <p class="subtitle">Type to search. The API will wait 500ms after you stop typing.</p>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search products (e.g. phone, shoes, watch)..." autocomplete="off">
    </div>

    <div class="stats-bar">
      <span id="statusMessage">Start typing to search...</span>
      <span>API Requests Made: <span id="apiCounter" class="counter-badge">0</span></span>
    </div>

    <ul id="resultsList" class="results-list"></ul>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const statusMessage = document.getElementById('statusMessage');
    const apiCounter = document.getElementById('apiCounter');
    const resultsList = document.getElementById('resultsList');

    let totalApiCalls = 0;

    // 1. Reusable Debounce Utility
    function debounce(callbackFunction, delay = 500) {
      let timer;
      return function (...args) {
        clearTimeout(timer); // Cancel the pending countdown
        timer = setTimeout(() => {
          callbackFunction(...args); // Run function after pause
        }, delay);
      };
    }

    // 2. Main API Fetch Function
    async function fetchProducts(searchTerm) {
      const cleanTerm = searchTerm.trim();

      // If input is empty, clear UI and exit
      if (!cleanTerm) {
        resultsList.innerHTML = '';
        statusMessage.innerText = 'Start typing to search...';
        return;
      }

      statusMessage.innerText = `Searching for "${cleanTerm}"...`;

      try {
        // Track and display the actual network request count
        totalApiCalls++;
        apiCounter.innerText = totalApiCalls;

        const url = `https://dummyjson.com/products/search?q=${encodeURIComponent(cleanTerm)}&limit=5`;
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status}`);
        }

        const data = await response.json();
        resultsList.innerHTML = '';

        if (!data.products || data.products.length === 0) {
          statusMessage.innerText = `No products found for "${cleanTerm}".`;
          return;
        }

        statusMessage.innerText = `Found ${data.products.length} products:`;

        // Render cards
        data.products.forEach(product => {
          const item = document.createElement('li');
          item.className = 'product-item';
          item.innerHTML = `
            <div>
              <div class="product-title">${product.title}</div>
              <div class="product-category">${product.category}</div>
            </div>
            <div class="product-price">$${product.price}</div>
          `;
          resultsList.appendChild(item);
        });

      } catch (err) {
        statusMessage.innerText = `Error: ${err.message}`;
      }
    }

    // 3. Wrap with Debounce (500ms delay)
    const handleDebouncedInput = debounce(fetchProducts, 500);

    // 4. Attach Event Listener
    searchInput.addEventListener('input', (event) => {
      handleDebouncedInput(event.target.value);
    });
  </script>
</body>
</html>
