<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Repo Finder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; padding: 40px 16px; }
    .container { width: 100%; max-width: 520px; }
    h2 { color: #58a6ff; text-align: center; margin-bottom: 8px; }
    .subtitle { color: #8b949e; font-size: 14px; text-align: center; margin-bottom: 20px; }
    input { width: 100%; padding: 12px 14px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #c9d1d9; font-size: 15px; outline: none; }
    input:focus { border-color: #58a6ff; }
    #status { margin-top: 10px; font-size: 13px; color: #8b949e; min-height: 20px; }
    .repo-list { margin-top: 15px; list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .repo-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
    .repo-card a { color: #58a6ff; text-decoration: none; font-weight: 600; }
    .repo-card a:hover { text-decoration: underline; }
    .star-badge { background: #21262d; border: 1px solid #30363d; padding: 4px 8px; border-radius: 12px; font-size: 12px; color: #e3b341; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🐙 GitHub Repo Finder</h2>
    <p class="subtitle">Live search with 500ms debounce</p>

    <input type="text" id="repoInput" placeholder="Search GitHub repos (e.g. react, node, vue)..." autocomplete="off">
    <p id="status"></p>
    <ul id="repoList" class="repo-list"></ul>
  </div>

  <script>
    const repoInput = document.getElementById('repoInput');
    const statusText = document.getElementById('status');
    const repoList = document.getElementById('repoList');

    // ==========================================================
    // ✍️ WRITE YOUR JAVASCRIPT LOGIC BELOW THIS LINE
    // ==========================================================

    // Step 1: Write the debounce(fn, delay) function
    function userDebounce(callbackFucntion, delay = 500) {
      let timer;
      return function(...args){
        clearTimeout(timer);
        timer = setTimeout(()=>{
          callbackFucntion(...args);
        },delay);
      };
    }
    
    // Step 2: Write the async function searchRepos(query)
    // - Check if query is empty -> clear UI and return
    // - Set statusText: "Searching GitHub..."
    // - Fetch from: `https://api.github.com/search/repositories?q=${encodeURIComponent(query)}&per_page=5`
    // - Check response.ok & parse JSON (data.items)
    // - If no items found -> statusText: "No repositories found."
    // - If items found -> Render each repo into repoList with format:
    //   `<li class="repo-card">
    //      <a href="${repo.html_url}" target="_blank">${repo.full_name}</a>
    //      <span class="star-badge">⭐ ${repo.stargazers_count}</span>
    //    </li>`
    async function searchRepos(query) {
        const searchTerm = query.trim();
      if(!searchTerm) {
        repoList.innerHTML="";
        statusText.innerText = "";
        return;
      }
      console.log("kaise");
      
        statusText.innerText="Searching GitHub...";
        try{

          const url = `https://api.github.com/search/repositories?q=${encodeURIComponent(searchTerm)}&per_page=5`
          const responseData = await fetch(url);
      console.log("kaise2");

          if(responseData.ok) {
      console.log("kaise2");

            const userRepo = await responseData.json();
            const repos = userRepo.items;
      console.log("kaise3");

            repoList.innerHTML="";
            if(!repos || repos.length === 0) {
              statusText.innerText=`No users found for "${searchTerm}".`;
              return;
            }
            statusText.innerText=`Found ${repos.length} users:`;

            repos.map(repo => {
              const item = document.createElement('li');
              item.className='repo-card';
              item.innerHTML = `
              <a href="${repo.html_url}" target="_blank">${repo.full_name}</a>
              <span class="star-badge">⭐ ${repo.stargazers_count}</span>`;
              repoList.appendChild(item);
            });
          } else {
            throw new Error(`HTTP Error: ${responseData.status}`);
            
          }
        } catch(error){
      console.log("kaise5");

          statusText.innerText=`Error: ${error.message}`;
    }
    }
    
    

    // Step 3: Create the debounced version (500ms delay)
 const handleUserDebouncedInput = userDebounce(searchRepos,500);
    // Step 4: Add the 'input' event listener on repoInput
repoInput.addEventListener('input', (event)=>{
  handleUserDebouncedInput(event.target.value)
});
  </script>
</body>
</html>
